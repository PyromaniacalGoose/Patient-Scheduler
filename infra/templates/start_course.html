<form method="post">
    {% csrf_token %}
    <label>Patient ID: <input name="patient_id" type="number" required></label><br>
    <label>Number of appointments: <input name="appointment_count" type="number" value="4" required></label><br>
    <label>Min interval (days): <input name="min_interval_days" type="number" value="56" required></label><br>
    <label>preferred max interval (days): <input name="soft_preferred_days" type="number" value="77" required></label><br>
    <label>Treatment type:
        <select name="treatment_type">
            <option value="1">V1</option>
            <option value="2">V2</option>
        </select>
    </label><br>
    <label>Earliest start: <input name="earliest_start" type="date" required></label><br>
    <button type="submit">Plan course</button>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</form>
