{% extends "base.html" %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <label for="patient-search">Find patient:</label>
    <input
        id="patient-search"
        type="search"
        placeholder="Type a name or patient number"
        autocomplete="off"
    >

    <label for="patient_number">Patient:</label>
    <select id="patient_number" name="patient_number" required>
        <option value="">Select a patient</option>
        {% for patient in patients %}
            <option value="{{ patient.patient_number }}">
                {{ patient.first_name }} {{ patient.last_name }}
                - {{ patient.patient_number }}
            </option>
        {% endfor %}
    </select>
    <p id="patient-search-status" role="status"></p>

    <script>
        const patientSearch = document.getElementById("patient-search");
        const patientSelect = document.getElementById("patient_number");
        const patientStatus = document.getElementById("patient-search-status");

        // Keep the original options so clearing the search restores them.
        const patientOptions = Array.from(patientSelect.options).slice(1);

        patientSearch.addEventListener("input", function () {
            const words = this.value.trim().toLocaleLowerCase().split(/\s+/);
            const selectedValue = patientSelect.value;

            const matches = patientOptions.filter(function (option) {
                const label = option.textContent.toLocaleLowerCase();
                return words.every(word => label.includes(word));
            });

            patientSelect.replaceChildren(
                new Option("Select a patient", ""),
                ...matches
            );

            if (matches.some(option => option.value === selectedValue)) {
                patientSelect.value = selectedValue;
            }

            patientStatus.textContent = matches.length === 0
                ? "No matching patients."
                : "";
        });
    </script>
    <label>Number of appointments: <input name="appointment_count" type="number" value="4" required></label><br>
    <label>Min interval (days): <input name="min_interval_days" type="number" value="56" required></label><br>
    <label>preferred max interval (days): <input name="soft_preferred_days" type="number" value="77" required></label><br>
    <label>Treatment type:
        <select name="treatment_type">
            <option value="1">V1</option>
            <option value="2">V2</option>
        </select>
    </label><br>
    <label>Earliest start: <input name="earliest_start" type="date" required></label><br>
    <button type="submit">Plan course</button>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
</form>
{% endblock %}
