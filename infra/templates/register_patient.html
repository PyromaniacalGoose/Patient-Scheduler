{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
    }

    h1 {
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    .required {
        color: #c00;
    }
</style>

</head>

<body>


<h1>Register Patient</h1>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="first_name">
            First Name <span class="required">*</span>
        </label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            required
        >
    </div>

    <div class="form-group">
        <label for="last_name">
            Last Name <span class="required">*</span>
        </label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            required
        >
    </div>

    <div class="form-group">
        <label for="cpr_number">
            CPR Number <span class="required">*</span>
        </label>
        <input
            type="text"
            id="cpr_number"
            name="cpr_number"
            required
        >
    </div>

    <div class="form-group">
        <label for="gender">
            Gender <span class="required">*</span>
        </label>

        <select id="gender" name="gender" required>
            <option selected="selected" disabled="disabled">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="unassigned">other</option>
        </select>
    </div>

    <button type="submit">Register Patient</button>
</form>


</body>
</html>
