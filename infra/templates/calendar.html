{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Schedule</title>
    <link rel="stylesheet" href="{% static 'infra/calendar.css' %}">
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js"></script>
</head>
<body>
    <div id="calendar" style="max-width: 1000px; margin: 40px auto;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'en-gb',
                firstDay: 1,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                eventSources: [
                    {
                        events: function (info, successCallback, failureCallback) {
                            const params = new URLSearchParams({
                                                start: info.startStr,
                                                end: info.endStr
                                            });
                                        
                                            fetch(`/calendar/events/?${params}`)
                                                .then(r => r.json())
                                                .then(data => {
                                                    console.log("BOOKED EVENTS:", data);
                                                    successCallback(data);
                                                })
                                                .catch(failureCallback);
                        }
                    },
                    {
                        events: function (info, successCallback, failureCallback) {
                            const params = new URLSearchParams({
                                start: info.startStr,
                                end: info.endStr
                            });
                        
                            fetch(`/calendar/availability/?${params}`)
                                .then(r => r.json())
                                .then(data => {
                                    console.log("AVAILABILITY:", data);
                                    successCallback(data);
                                })
                                .catch(failureCallback);
                        }
                    }
                ]
            });
            calendar.render();
        });
    </script>
</body>
</html>
