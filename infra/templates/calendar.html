{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Schedule</title>
    <link rel="stylesheet" href="{% static 'infra/calendar.css' %}">
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js"></script>
</head>
<body>
        <div class="navigation-buttons"> 
            <a href="/calendar/patients/" class="nav-button">Patients</a> 
            {% if perms.infra.can_book_appointments %}
                <a href="/courses/start/" class="nav-button">Start Course</a> 
                <a href="/calendar/register_patient/" class="nav-button">Register Patient</a> 
                <a href="/calendar/schedule" class="nav-button">Schedule</a> 
            {% endif %}
        </div> 

    <div id="calendar" style="max-width: 1000px; margin: 40px auto;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'en-gb',
                firstDay: 1,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                eventSources: [
                    {
                        events: function (info, successCallback, failureCallback) {
                            const params = new URLSearchParams({
                                                start: info.startStr,
                                                end: info.endStr
                                            });
                                        
                                            fetch(`/calendar/events/?${params}`)
                                                .then(r => r.json())
                                                .then(data => {
                                                    successCallback(data);
                                                })
                                                .catch(failureCallback);
                        }
                    },
                    {
                        events: function (info, successCallback, failureCallback) {
                            const params = new URLSearchParams({
                                start: info.startStr,
                                end: info.endStr
                            });
                        
                            fetch(`/calendar/availability/?${params}`)
                                .then(r => r.json())
                                .then(data => {
                                    successCallback(data);
                                })
                                .catch(failureCallback);
                        }
                    }
                ],
                eventClassNames: function (info) {
                    if (info.event.extendedProps.appointment_id) {
                        return ['appointment-event'];
                    }
                    return [];
                },
                eventClick: function (info) {
                    const appointmentId = info.event.extendedProps.appointment_id;
                    if (appointmentId) {
                        window.location.href = `/appointments/${appointmentId}/`;
                    }
                },
            });
            calendar.render();
        });
    </script>
</body>
</html>
